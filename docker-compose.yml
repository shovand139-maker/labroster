# Local SQL Server for development and integration tests.
#   docker compose up -d
# Then see "Run it locally" in README.md.
services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "LabRoster!Local2026"
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'LabRoster!Local2026' -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
    volumes:
      - sql-data:/var/opt/mssql

volumes:
  sql-data:
