version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      aspnetcore:
        patterns: ["Microsoft.AspNetCore.*"]
      test:
        patterns: ["xunit*", "Microsoft.NET.Test.Sdk"]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      angular:
        patterns: ["@angular/*", "@angular-devkit/*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
