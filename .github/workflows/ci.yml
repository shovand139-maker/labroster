name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # Throwaway credentials for the CI-only SQL Server container.
  SQL_ADMIN: Server=localhost,1433;Database=LabRoster;User ID=sa;Password=LabRoster!Ci2026;TrustServerCertificate=True;Encrypt=True
  SQL_SERVER: Server=localhost,1433;User ID=sa;Password=LabRoster!Ci2026;TrustServerCertificate=True;Encrypt=True

jobs:
  api:
    name: API · build, unit and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      sql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: LabRoster!Ci2026
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'LabRoster!Ci2026' -Q 'SELECT 1' -b -o /dev/null"
          --health-interval 10s --health-timeout 5s --health-retries 15 --health-start-period 20s
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - run: dotnet restore LabRoster.slnx

      - run: dotnet build LabRoster.slnx --configuration Release --no-restore

      - name: Test against SQL Server
        run: >-
          dotnet test LabRoster.slnx --configuration Release --no-build
          --logger "trx;LogFileName=results.trx" --logger "console;verbosity=normal"
        env:
          LABROSTER_TEST_SQL: ${{ env.SQL_SERVER }}

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: api-test-results
          path: tests/**/TestResults/*.trx
          if-no-files-found: ignore

  web:
    name: Web · unit tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - run: npm test

      - run: npm run build

  e2e:
    name: End-to-end · Playwright against the full stack
    needs: [api, web]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      sql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: LabRoster!Ci2026
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'LabRoster!Ci2026' -Q 'SELECT 1' -b -o /dev/null"
          --health-interval 10s --health-timeout 5s --health-retries 15 --health-start-period 20s
    env:
      # Matches appsettings.Development.json, which the API runs with here for demo sign-in.
      APP_PASSWORD: Dev!App-Passw0rd
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the Angular app
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Publish the API with the app in wwwroot
        run: |
          dotnet publish src/LabRoster.Api --configuration Release --output out/api
          mkdir -p out/api/wwwroot
          cp -r web/dist/labroster-web/browser/. out/api/wwwroot/

      - name: Migrate and seed the database
        run: >-
          dotnet run --project src/LabRoster.Migrator --configuration Release --
          --connection "$SQL_ADMIN" --create-database --seed
          --app-login labroster_app --app-password "$APP_PASSWORD"

      - name: Start the API
        working-directory: out/api
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://localhost:5080
        run: |
          nohup dotnet LabRoster.Api.dll > "$GITHUB_WORKSPACE/api.log" 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://localhost:5080/health/ready > /dev/null; then
              echo "API is ready"
              exit 0
            fi
            sleep 2
          done
          cat "$GITHUB_WORKSPACE/api.log"
          exit 1

      - name: Install Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Run Playwright
        working-directory: web
        env:
          E2E_BASE_URL: http://localhost:5080
        run: npx playwright test

      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: e2e-report
          path: |
            web/playwright-report
            web/test-results
            api.log
          if-no-files-found: ignore
